[build]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "18"

# Route all /api/* requests directly to your live Render backend
[[redirects]]
  from = "/api/*"
  to = "https://athenaeum-bookstore.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
